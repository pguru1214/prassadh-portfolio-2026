name: Import portfolio source
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import portfolio files
        shell: bash
        run: |
          curl --fail --location --retry 3 "https://prassadh-portfolio-2026.netlify.app/portfolio-source.tar.gz" -o /tmp/portfolio-source.tar.gz
          tar -xzf /tmp/portfolio-source.tar.gz
          rm -f .github/workflows/import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import portfolio source"
          git push origin main
